name: service-e

on:
  push:
    paths:
      - "service-e/**"
      - ".github/workflows/service-e.yml"
      - ".github/workflows/reusable-service-ci.yml"

  pull_request:
    paths:
      - "service-e/**"
      - ".github/workflows/service-e.yml"
      - ".github/workflows/reusable-service-ci.yml"

jobs:
  ci:
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service_name: service-e
      dockerfile: service-e/Dockerfile
      context: service-e
