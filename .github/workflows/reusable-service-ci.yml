name: Reusable Service CI

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      context:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  ci:
    runs-on: ubuntu-latest

    environment: dev

    env:
      SERVICE_NAME: ${{ inputs.service_name }}
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

    steps:

      # -------------------------
      # 1. Checkout source code
      # -------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------
      # 2. Setup Python
      # -------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # -------------------------
      # 3. Unit tests
      # -------------------------
      - name: Unit tests
        working-directory: ${{ inputs.context }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            pip install pytest
          fi
          pytest -q

      # -------------------------
      # 4. Trivy filesystem scan
      # -------------------------
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ inputs.context }}
          severity: CRITICAL,HIGH
          exit-code: "1"

      # -------------------------
      # 5. Configure AWS using OIDC
      # Only required on main
      # -------------------------
      - name: Configure AWS credentials with OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------
      # 6. Resolve ECR registry
      # -------------------------
      - name: Resolve ECR registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
          echo "ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com" >> "$GITHUB_ENV"

      # -------------------------
      # 7. Login to ECR
      # -------------------------
      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------
      # 8. Build and optionally push
      # -------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ github.event_name == 'push' && format('{0}/{1}:{2}', env.ECR_REGISTRY, env.SERVICE_NAME, github.sha) || format('{0}:test', env.SERVICE_NAME) }}
